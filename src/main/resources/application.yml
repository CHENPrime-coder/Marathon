spring:
  application:
    name: marathon
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: jdbc:sqlite:marathon.db
    username:
    password:
  mvc:
    static-path-pattern: /files/**
  web:
    resources:
      static-locations: file:uploads/
logging:
  level:
    com.example.marathon.mapper: debug
mybatis:
  mapper-locations: classpath:mappers/*.xml
  type-aliases-package: com.example.marathon.table,com.example.marathon.pojo
